name: Tap checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tap-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Cask checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 -c 'import os,re,sys; sys.exit(0 if re.fullmatch(r"\[(FEAT|FIX|CHORE|DOCS|REFACTOR|TEST|CI|PERF|BUILD|REVERT)\] \S.*", os.environ["PR_TITLE"]) else "Use a prefixed PR title")'
      - name: Check Ruby syntax
        run: ruby -c Casks/gksdud.rb
      - name: Verify published ZIP and checksums
        run: python3 scripts/validate-cask.py
